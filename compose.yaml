services:
  db-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nodex
      POSTGRES_PASSWORD: nodex
      POSTGRES_DB: nodex_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodex -d nodex_test"]
      interval: 2s
      timeout: 3s
      retries: 15
