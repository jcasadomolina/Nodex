name: Pruebas

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nodex
          POSTGRES_PASSWORD: nodex
          POSTGRES_DB: nodex_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nodex -d nodex_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://nodex:nodex@localhost:5433/nodex_test
      DIRECT_URL: postgresql://nodex:nodex@localhost:5433/nodex_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: backend/.cache/models
          key: models-paraphrase-multilingual-MiniLM-L12-v2
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nodex
          POSTGRES_PASSWORD: nodex
          POSTGRES_DB: nodex_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nodex -d nodex_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://nodex:nodex@localhost:5433/nodex_test
      DIRECT_URL: postgresql://nodex:nodex@localhost:5433/nodex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: backend/.cache/models
          key: models-paraphrase-multilingual-MiniLM-L12-v2
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-playwright
          path: e2e/playwright-report
