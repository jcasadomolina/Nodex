<!doctype html>

  <title>Sin conexión · Nodex</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f4; --fg: #1f1f1f; --muted: #6b6560; }

      background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 10px; background: #ffa247; color: #1f1f1f; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" rx="16" fill="#ffa247"/><g fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2.5" stroke-linecap="round"><line x1="32" y1="33" x2="32" y2="54"/><line x1="32" y1="33" x2="14.7" y2="43"/><line x1="32" y1="33" x2="12.9" y2="22"/><line x1="32" y1="33" x2="32" y2="12"/><line x1="32" y1="33" x2="51.1" y2="22"/><line x1="32" y1="33" x2="49.3" y2="43"/><circle cx="32" cy="54" r="4" stroke="none"/><circle cx="14.7" cy="43" r="3.5" stroke="none"/><circle cx="12.9" cy="22" r="4.5" stroke="none"/><circle cx="32" cy="12" r="3" stroke="none"/><circle cx="51.1" cy="22" r="5" stroke="none"/><circle cx="49.3" cy="43" r="4" stroke="none"/><circle cx="32" cy="33" r="9.5" stroke="none"/></g></svg>
    <h1>Estás sin conexión</h1>
    <p>Nodex necesita Internet para cargar tus notas y enlaces.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
